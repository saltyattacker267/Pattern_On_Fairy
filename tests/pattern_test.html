<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Pattern Module Tests</title>
  <style>
    body { font-family: monospace; background: #111; color: #ddd; padding: 16px; }
    .pass { color: #4CFF8A; }
    .fail { color: #FF4C4C; }
    #summary { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="summary"></div>
  <div id="log"></div>

  <script src="../js/config/patterns.js"></script>
  <script src="../js/pattern/PatternGrid.js"></script>
  <script src="../js/pattern/PatternPath.js"></script>
  <script src="../js/pattern/PatternMatcher.js"></script>
  <script id="testScript">
  (function (POF) {
    'use strict';

    var passed = 0;
    var failed = 0;
    var lines = [];

    function check(name, cond) {
      if (cond) passed++; else failed++;
      lines.push({ ok: !!cond, name: name });
    }

    function seqStr(seq, len) {
      var out = [];
      for (var i = 0; i < len; i++) out.push(seq[i]);
      return out.join('-');
    }

    // 노드 입력 시퀀스를 PatternPath에 넣어 결과 궤적을 얻는다
    function build(inputs) {
      var p = new POF.PatternPath(3);
      for (var i = 0; i < inputs.length; i++) p.tryAdd(inputs[i]);
      return p;
    }

    var mid = POF.PatternGrid.middleOf;
    var M = POF.PatternMatcher;

    // 1. 중간 노드 계산
    check('middleOf 1-3 = 2', mid(1, 3) === 2);
    check('middleOf 3-1 = 2', mid(3, 1) === 2);
    check('middleOf 1-9 = 5', mid(1, 9) === 5);
    check('middleOf 3-7 = 5', mid(3, 7) === 5);
    check('middleOf 1-7 = 4', mid(1, 7) === 4);
    check('middleOf 4-6 = 5', mid(4, 6) === 5);
    check('middleOf 2-8 = 5', mid(2, 8) === 5);
    check('middleOf 4-8 = 0 (외곽 대각 도약)', mid(4, 8) === 0);
    check('middleOf 2-6 = 0 (외곽 대각 도약)', mid(2, 6) === 0);
    check('middleOf 1-6 = 0', mid(1, 6) === 0);
    check('middleOf 1-2 = 0', mid(1, 2) === 0);
    check('middleOf 5-5 = 0', mid(5, 5) === 0);

    // 2. 궤적 규칙
    var p;
    p = build([1, 3]);
    check('자동 포함: 1->3 = 1-2-3', seqStr(p.nodes, p.length) === '1-2-3');
    p = build([1, 9]);
    check('자동 포함: 1->9 = 1-5-9', seqStr(p.nodes, p.length) === '1-5-9');
    p = build([4, 8, 6]);
    check('외곽 대각 도약: 4-8-6', seqStr(p.nodes, p.length) === '4-8-6');
    p = build([2, 1, 3]);
    check('방문한 중간 노드는 재포함 안 함: 2-1-3', seqStr(p.nodes, p.length) === '2-1-3');
    p = build([1, 2, 3, 2]);
    check('시작점 외 재방문 무시: 1-2-3', seqStr(p.nodes, p.length) === '1-2-3' && !p.closed);
    p = build([5, 5, 5, 6]);
    check('같은 노드 연속 입력 무시: 5-6', seqStr(p.nodes, p.length) === '5-6');
    p = build([2, 4, 7, 8, 9, 6, 2]);
    check('시작점 복귀 닫힘: 2-4-7-8-9-6-2', seqStr(p.nodes, p.length) === '2-4-7-8-9-6-2' && p.closed);
    check('닫힘 시 distinctCount = 6', p.distinctCount() === 6);
    p = build([2, 4, 7, 8, 9, 6, 2, 3, 1]);
    check('닫힌 후 추가 입력 무시', seqStr(p.nodes, p.length) === '2-4-7-8-9-6-2');
    p = build([2, 5, 2]);
    check('고유 노드 3개 미만 복귀는 닫힘 불가: 2-5', seqStr(p.nodes, p.length) === '2-5' && !p.closed);
    p = build([1, 2, 3, 1]);
    check('복귀 경로의 방문 중간 노드 처리: 1-2-3-1 닫힘', seqStr(p.nodes, p.length) === '1-2-3-1' && p.closed);
    p = build([1, 4, 5, 1]);
    check('삼각 복귀 닫힘: 1-4-5-1', seqStr(p.nodes, p.length) === '1-4-5-1' && p.closed);

    // 3. 보스 패턴 데이터 유효성 + 정방향/역방향 판정
    var bosses = POF.Patterns.bosses;
    for (var b = 0; b < bosses.length; b++) {
      for (var ph = 0; ph < bosses[b].phases.length; ph++) {
        var target = bosses[b].phases[ph].nodes;
        var label = bosses[b].stage + ' P' + (ph + 1) + ' [' + target.join('-') + ']';
        var closed = M.isClosed(target, target.length);

        var fwd = build(target);
        check(label + ' 데이터가 연결 규칙과 일치',
          seqStr(fwd.nodes, fwd.length) === target.join('-') && fwd.closed === closed);
        check(label + ' 정방향 정타', M.matches(fwd.nodes, fwd.length, target));

        var revInput = target.slice().reverse();
        var rev = build(revInput);
        check(label + ' 역방향 정타', M.matches(rev.nodes, rev.length, target));

        if (closed) {
          // 순환 패턴: 모든 시작점 x 양방향
          var n = target.length - 1;
          var allOk = true;
          for (var off = 0; off < n; off++) {
            for (var dir = -1; dir <= 1; dir += 2) {
              var seq = [];
              for (var k = 0; k <= n; k++) {
                seq.push(target[(((off + dir * k) % n) + n) % n]);
              }
              var rp = build(seq);
              if (!M.matches(rp.nodes, rp.length, target)) allOk = false;
            }
          }
          check(label + ' 순환: 모든 시작점/양방향 정타', allOk);

          // 닫지 않고 끝내면 오답
          var openSeq = target.slice(0, n);
          var op = build(openSeq);
          check(label + ' 닫지 않은 입력은 오답', !M.matches(op.nodes, op.length, target));
        } else if (target.length >= 4) {
          // 열린 패턴은 시작점 회전 시 오답
          var rot = target.slice(1).concat(target.slice(0, 1));
          check(label + ' 열린 패턴 회전 입력은 오답', !M.matches(rot, rot.length, target));
        }

        // 마지막 노드 누락 시 오답
        var shortSeq = target.slice(0, target.length - 1);
        check(label + ' 길이 부족 오답', !M.matches(shortSeq, shortSeq.length, target));
      }
    }

    // 4. 오입력
    check('다른 패턴 오답: 4-5-6 vs 1-2-3', !M.matches([1, 2, 3], 3, [4, 5, 6]));
    check('같은 노드 다른 순서 오답: 4-6-5 vs 4-5-6', !M.matches([4, 6, 5], 3, [4, 5, 6]));

    // 출력 (브라우저 / 콘솔 공용)
    var summary = (failed === 0 ? 'ALL PASS' : 'FAIL') + '  passed=' + passed + ' failed=' + failed;
    if (typeof document !== 'undefined' && document.getElementById('log')) {
      var log = document.getElementById('log');
      for (var i = 0; i < lines.length; i++) {
        var div = document.createElement('div');
        div.className = lines[i].ok ? 'pass' : 'fail';
        div.textContent = (lines[i].ok ? '[PASS] ' : '[FAIL] ') + lines[i].name;
        log.appendChild(div);
      }
      var s = document.getElementById('summary');
      s.className = failed === 0 ? 'pass' : 'fail';
      s.textContent = summary;
    }
    POF.testResult = { passed: passed, failed: failed, lines: lines, summary: summary };
  })(window.POF = window.POF || {});
  </script>
</body>
</html>
